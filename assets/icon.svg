<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Fluent Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0086F0" />
      <stop offset="50%" stop-color="#005FB8" />
      <stop offset="100%" stop-color="#003975" />
    </linearGradient>

    <!-- Acrylic Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cube Face Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60CDFF" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A9E" />
      <stop offset="100%" stop-color="#004578" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#106EBE" />
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60CDFF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0078D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001830" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Squircle Tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#highlightGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />

  <!-- Geometric Coordinate Grid Elements -->
  <circle cx="256" cy="256" r="170" fill="url(#sphereGlow)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#60CDFF" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- 3D Geometric Isometric Prism / Cube -->
  <g transform="translate(256, 256)">
    <!-- Top Face -->
    <polygon points="0,-120 104,-60 0,0 -104,-60" fill="url(#cubeTop)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <!-- Left Face -->
    <polygon points="-104,-60 0,0 0,120 -104,60" fill="url(#cubeLeft)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Face -->
    <polygon points="0,0 104,-60 104,60 0,120" fill="url(#cubeRight)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />

    <!-- Inscribed Angle / Compass Overlay -->
    <path d="M -104,60 L 0,-120 L 104,60 Z" fill="none" stroke="#FFE97D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    
    <!-- Center Measurement Focal Point -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#60CDFF" stroke-width="2.5" />

    <!-- Dimension Tick Lines -->
    <line x1="-120" y1="60" x2="-120" y2="-60" stroke="#60CDFF" stroke-width="2" stroke-linecap="round" />
    <line x1="-126" y1="60" x2="-114" y2="60" stroke="#60CDFF" stroke-width="2" />
    <line x1="-126" y1="-60" x2="-114" y2="-60" stroke="#60CDFF" stroke-width="2" />
  </g>
</svg>
